[package]
name = "agent-awake"
version = "0.3.0"
edition = "2021"
description = "Keep AI agents running even with the laptop lid closed. Remote control via Telegram."
license = "MIT"
authors = ["vinyaspoojary318-cloud"]
repository = "https://github.com/vinyaspoojary318-cloud/Agent-awake"

[dependencies]
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.12", features = ["macros", "auto-send"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
ctrlc = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }
sysinfo = "0.30"
dotenvy = "0.15"
tray-icon = "0.19"
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
